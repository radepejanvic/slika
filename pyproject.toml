[project]
name = "slika"
version = "0.1.0"
description = "Image processing DSL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textX[cli]>=4.3.0",
    "opencv-python>=4.13.0.92",
    "pygls>=1.3.0",
    "lsprotocol>=2023.0.0",
]

[dependency-groups]
dev = [
    "lsp-devtools>=0.4.0",
    "pytest>=9.0.3",
]

[tool.uv]
package=true

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]

[tool.setuptools.package-data]
"slika.grammar" = ["*.tx"]

[project.scripts]
slika = "cli:main"
slika-ls = "src.lsp:main"

[project.entry-points."textx_languages"]
slika = "src.grammar:slika_language"

[tool.pytest.ini_options]
pythonpath = ["src"]